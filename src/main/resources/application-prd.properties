spring.application.name=pokemon-api
server.port=8080

springdoc.swagger-ui.path=/

# Database
# No profile prd o banco e as tabelas ja devem existir: nao usamos
# createDatabaseIfNotExist e o Hibernate nao altera o schema (ddl-auto=none).
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL}:${DB_SERVER_PORT}/${DB_SCHEMA}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
