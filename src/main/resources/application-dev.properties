spring.application.name=pokemon-api
server.port=8080

springdoc.swagger-ui.path=/

# Database
# No profile prd o banco e as tabelas ja devem existir: nao usamos
# createDatabaseIfNotExist e o Hibernate nao altera o schema (ddl-auto=none).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=api;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=1q2w3e4R@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
